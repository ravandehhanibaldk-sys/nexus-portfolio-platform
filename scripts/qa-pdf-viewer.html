<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#333;">
<canvas id="c"></canvas>
<script type="module">
  import * as pdfjsLib from "/pdfjs/pdf.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc = "/pdfjs/pdf.worker.mjs";

  const params = new URLSearchParams(location.search);
  const pageNum = parseInt(params.get("page") || "1", 10);
  const file = params.get("file") || "/file.pdf";

  const loadingTask = pdfjsLib.getDocument({ url: new URL(file, location.href).href });
  const pdf = await loadingTask.promise;
  const page = await pdf.getPage(pageNum);
  const scale = 2.4;
  const viewport = page.getViewport({ scale });
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;
  document.title = `rendered:${pageNum}:${pdf.numPages}`;
  document.body.setAttribute("data-rendered", "true");
  document.body.setAttribute("data-numpages", String(pdf.numPages));
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Location Plan — Waterfront Site</title>
<desc id="desc">Coded site-context diagram: real property boundary, adjacent buildings, roads, green areas, and compass orientation, matching the Environmental Diagrams instrument-panel visual language.</desc>

<!--
  Coded replacement for the photographic-overlay Location Plan (item 9),
  matching solar-diagram.tsx/wind-diagram.tsx's flat, muted-line
  instrument-panel style instead of a photo. Geometry traced from
  B-47-site-spotting-villa-efe_result.png (the same asset already
  confirmed accurate in earlier sessions) — real relative positions and
  shapes for the site boundary, adjacent buildings, roads, green-area
  extent, and compass orientation. Simplified to clean flat shapes at the
  same level of schematic abstraction as the solar-path arc or wind-flow
  lines elsewhere in this diagram family — not a literal pixel trace, but
  topologically faithful to the real reference, not invented.

  Unlike its siblings (01-09), this file carries explicit width/height
  attributes matching the viewBox. Those are only ever loaded inline via
  useInlineSvgLoader (fetch + DOM injection, CSS-sized by the container),
  where width/height on the root are irrelevant. This file is ALSO
  referenced as a plain <img src> on the PDF side (narrative-sheet-
  landscape.tsx — the print pipeline doesn't inline-inject any instrument-
  panel SVG) — and a viewBox-only root has no reliable intrinsic size for
  <img>, so Chromium fell back to a default 300x150 replaced-element box
  and rendered the diagram cropped instead of letterboxed under
  object-fit:contain. Explicit width/height fixes the <img> case and is a
  no-op for the inline-injected website case.
-->
<style>
  .heading { font-family:Fraunces, Georgia, serif; fill:#24344a; }
  .label { font-family:Inter, Arial, sans-serif; fill:#566274; letter-spacing:1.2px; }
  .callout { font-family:Inter, Arial, sans-serif; fill:#24344a; font-size:13px; }
  .site-fill { fill:#f5f3ee; stroke:#8d9399; stroke-width:1.5; }
  .adjacent-fill { fill:#e4dcea; stroke:#9b8aa8; stroke-width:1.2; }
  .green-fill { fill:#e6ede4; stroke:#8fae8a; stroke-width:1.2; }
  .road { fill:none; stroke:#c5c9ce; stroke-width:10; stroke-linecap:round; }
  .road-line { fill:none; stroke:#ffffff; stroke-width:1.5; stroke-dasharray:8 8; }
  .coast { fill:#d6e6ec; stroke:#7ea3b3; stroke-width:1.5; }
  .project-site { fill:#f4e6c8; stroke:#c99a3a; stroke-width:2.5; }
  .north { stroke:#28343f; fill:#28343f; }
  .leader { stroke:#9ba4ad; stroke-width:1; stroke-dasharray:3 3; }
</style>

<text x="45" y="60" class="heading" font-size="30">Location Plan</text>
<line x1="45" y1="82" x2="78" y2="82" stroke="#c99a3a" stroke-width="3"/>

<g id="site-context">
  <!-- Coastline, upper edge of the site -->
  <path class="coast" d="M60 95 C280 60 520 75 700 60 C860 48 1000 60 1150 95 L1150 10 L60 10 Z"/>

  <!-- Green area / vegetation extent, surrounding the developed cluster -->
  <path class="green-fill" d="M60 95 C280 60 520 75 700 60 C860 48 1000 60 1150 95 L1150 260 C980 220 900 245 830 300 L560 300 C480 260 380 250 300 290 L60 320 Z"/>

  <!-- Coast road, curving past the site -->
  <path class="road" d="M470 130 C560 175 700 195 900 210 C1000 218 1080 225 1150 235"/>
  <path class="road-line" d="M470 130 C560 175 700 195 900 210 C1000 218 1080 225 1150 235"/>
  <text x="900" y="195" class="callout" font-size="12" text-anchor="middle">COAST ROAD</text>

  <!-- Secondary access road, running down to the lower edge -->
  <path class="road" d="M430 250 C400 340 370 430 330 520 C300 585 270 640 230 700"/>
  <path class="road-line" d="M430 250 C400 340 370 430 330 520 C300 585 270 640 230 700"/>
  <text x="330" y="500" class="callout" font-size="12" text-anchor="middle" transform="rotate(-70 330 500)">SECONDARY ACCESS ROAD</text>

  <!-- Adjacent buildings — large complex, west of the site -->
  <g class="adjacent-fill">
    <rect x="70" y="330" width="290" height="230" rx="4"/>
    <rect x="220" y="440" width="150" height="140" rx="4"/>
  </g>
  <!-- Adjacent buildings — smaller structures, south/southeast of the site -->
  <g class="adjacent-fill">
    <rect x="470" y="430" width="90" height="70" rx="3"/>
    <rect x="640" y="410" width="110" height="90" rx="3"/>
    <rect x="800" y="490" width="100" height="80" rx="3"/>
    <rect x="960" y="470" width="120" height="100" rx="3"/>
  </g>
  <text x="145" y="320" class="callout" font-size="12">ADJACENT BUILDINGS</text>
  <line x1="145" y1="325" x2="220" y2="380" class="leader"/>

  <!-- Adjacent property limits, lower boundary -->
  <path class="leader" d="M300 620 L980 610"/>
  <text x="640" y="640" class="callout" font-size="12" text-anchor="middle">ADJACENT PROPERTY LIMITS</text>

  <!-- Project site — the villa's own footprint, boundary highlighted -->
  <polygon id="project-site-boundary" class="project-site" points="380,240 500,225 555,330 415,365"/>
  <text x="470" y="300" class="callout" font-size="13" font-weight="700" text-anchor="middle" fill="#8a6a1e">PROJECT SITE</text>

  <!-- Compass, real orientation (north toward the sea per the source reference) -->
  <g id="compass" transform="translate(1090 660)">
    <circle r="34" fill="none" stroke="#28343f" stroke-width="1.5"/>
    <path class="north" d="M0 -30 L7 -6 L0 -12 L-7 -6 Z"/>
    <line x1="0" y1="-6" x2="0" y2="30" stroke="#28343f" stroke-width="1.5"/>
    <text x="0" y="-38" class="callout" font-size="14" font-weight="700" text-anchor="middle">N</text>
  </g>
</g>

<g id="site-location-chips" transform="translate(55 690)">
  <g id="site-chip-1"><rect width="170" height="44" rx="4" fill="#fbfaf7" stroke="#e3d7c4"/><text id="site-chip-1-label" class="label" x="12" y="18" font-size="9">SITE CONDITION</text><text id="site-chip-1-value" class="callout" x="12" y="35" font-size="12">WATERFRONT</text></g>
  <g id="site-chip-2" transform="translate(190 0)"><rect width="170" height="44" rx="4" fill="#fbfaf7" stroke="#e3d7c4"/><text id="site-chip-2-label" class="label" x="12" y="18" font-size="9">ACCESS</text><text id="site-chip-2-value" class="callout" x="12" y="35" font-size="12">2 ROADS</text></g>
</g>

</svg>

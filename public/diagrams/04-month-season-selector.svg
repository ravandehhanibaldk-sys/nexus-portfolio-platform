<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Month / Season Selector</title>
<desc id="desc">Twelve independently addressable month nodes, fixed season markers, track, and visual state examples.</desc>

<style>
  .heading { font-family:Fraunces, Georgia, serif; fill:#24344a; }
  .body { font-family:Inter, Arial, sans-serif; fill:#334155; }
  .label { font-family:Inter, Arial, sans-serif; fill:#566274; letter-spacing:1.4px; }
  .data { font-family:Inter, Arial, sans-serif; fill:#24344a; }
  .solar { stroke:#e58b1a; fill:none; }
  .solar-fill { fill:#e58b1a; }
  .wind { stroke:#4f9fd9; fill:none; }
  .wind-secondary { stroke:#62b8ae; fill:none; }
  .ref { stroke:#9ba4ad; fill:none; stroke-dasharray:6 6; }
  .fine { stroke:#c5c9ce; fill:none; }
  .mass-front { fill:#f5f3ee; stroke:#8d9399; }
  .mass-side { fill:#dddcd7; stroke:#8d9399; }
  .mass-top { fill:#fbfaf7; stroke:#8d9399; }
  .shadow { fill:#aeb2b4; opacity:.28; }
  .north { stroke:#28343f; fill:none; }
</style>


<g id="component-month-selector">
  <text x="42" y="56" class="heading" font-size="30">Month / Season Selector</text>
  <text x="42" y="84" class="label" font-size="12">SEMANTIC VISUAL STATES · DEFAULT / HOVER / SELECTED</text>
  <line id="month-track" x1="80" y1="250" x2="1120" y2="250" stroke="#b9bdc0" stroke-width="2"/>
  
<g id="month-jan" data-state="default">
  <circle id="month-jan-node" cx="80" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-jan-selected" cx="80" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-jan-label" x="80" y="220" class="label" text-anchor="middle" font-size="12">JAN</text>
</g>
<g id="month-feb" data-state="default">
  <circle id="month-feb-node" cx="174" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-feb-selected" cx="174" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-feb-label" x="174" y="220" class="label" text-anchor="middle" font-size="12">FEB</text>
</g>
<g id="month-mar" data-state="default">
  <circle id="month-mar-node" cx="268" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-mar-selected" cx="268" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-mar-label" x="268" y="220" class="label" text-anchor="middle" font-size="12">MAR</text>
</g>
<g id="month-apr" data-state="default">
  <circle id="month-apr-node" cx="362" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-apr-selected" cx="362" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-apr-label" x="362" y="220" class="label" text-anchor="middle" font-size="12">APR</text>
</g>
<g id="month-may" data-state="default">
  <circle id="month-may-node" cx="456" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-may-selected" cx="456" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-may-label" x="456" y="220" class="label" text-anchor="middle" font-size="12">MAY</text>
</g>
<g id="month-jun" data-state="default">
  <circle id="month-jun-node" cx="550" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-jun-selected" cx="550" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-jun-label" x="550" y="220" class="label" text-anchor="middle" font-size="12">JUN</text>
</g>
<g id="month-jul" data-state="default">

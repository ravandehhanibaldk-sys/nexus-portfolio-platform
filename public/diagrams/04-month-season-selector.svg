  <circle id="month-sep-selected" cx="832" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-sep-label" x="832" y="220" class="label" text-anchor="middle" font-size="12">SEP</text>
</g>
<g id="month-oct" data-state="default">
  <circle id="month-oct-node" cx="926" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-oct-selected" cx="926" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-oct-label" x="926" y="220" class="label" text-anchor="middle" font-size="12">OCT</text>
</g>
<g id="month-nov" data-state="default">
  <circle id="month-nov-node" cx="1020" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-nov-selected" cx="1020" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-nov-label" x="1020" y="220" class="label" text-anchor="middle" font-size="12">NOV</text>
</g>
<g id="month-dec" data-state="default">
  <circle id="month-dec-node" cx="1114" cy="250" r="7" fill="#b9bdc0"/>
  <circle id="month-dec-selected" cx="1114" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-dec-label" x="1114" y="220" class="label" text-anchor="middle" font-size="12">DEC</text>
</g>
  <g id="season-markers">
    <g id="season-winter"><circle cx="150" cy="145" r="15" fill="none" stroke="#6fa7c6" stroke-width="2"/><path d="M150 125 v40 M130 145 h40 M136 131 l28 28 M164 131 l-28 28" stroke="#6fa7c6"/></g>
    <g id="season-spring"><path d="M430 130 q20 -22 40 0" stroke="#5d9d54" fill="none" stroke-width="3"/><path d="M450 130 l-10 20 l20 -5" fill="none" stroke="#5d9d54"/></g>
    <g id="season-summer"><circle cx="690" cy="145" r="12" fill="none" stroke="#e5a51a" stroke-width="2"/><line x1="708.0" y1="145.0" x2="717.0" y2="145.0" stroke="#e5a51a"/><line x1="702.7" y1="157.7" x2="709.1" y2="164.1" stroke="#e5a51a"/><line x1="690.0" y1="163.0" x2="690.0" y2="172.0" stroke="#e5a51a"/><line x1="677.3" y1="157.7" x2="670.9" y2="164.1" stroke="#e5a51a"/><line x1="672.0" y1="145.0" x2="663.0" y2="145.0" stroke="#e5a51a"/><line x1="677.3" y1="132.3" x2="670.9" y2="125.9" stroke="#e5a51a"/><line x1="690.0" y1="127.0" x2="690.0" y2="118.0" stroke="#e5a51a"/><line x1="702.7" y1="132.3" x2="709.1" y2="125.9" stroke="#e5a51a"/></g>
    <g id="season-autumn"><path d="M960 130 q18 -8 24 12 q-14 12 -24 5 q-8 -10 0 -17z" fill="none" stroke="#d77b3b" stroke-width="2"/></g>
  </g>
  <g id="month-state-guide" transform="translate(70 330)">
    <circle cx="0" cy="0" r="7" fill="#b9bdc0"/><text class="label" x="20" y="4" font-size="11">DEFAULT</text>
    <circle cx="130" cy="0" r="7" fill="#b9bdc0" stroke="#4f89c7" stroke-width="3"/><text class="label" x="150" y="4" font-size="11">HOVER</text>
    <circle cx="270" cy="0" r="7" fill="#4f89c7"/><text class="label" x="290" y="4" font-size="11">SELECTED</text>
  </g>
</g>
</svg>

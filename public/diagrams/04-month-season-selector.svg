  <circle id="month-jul-selected" cx="644" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-jul-label" x="644" y="220" class="label" text-anchor="middle" font-size="12">JUL</text>
</g>
<g id="month-aug" data-state="default">

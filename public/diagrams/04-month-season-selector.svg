  <circle id="month-aug-selected" cx="738" cy="250" r="16" fill="#4f89c7" opacity="0"/>
  <text id="month-aug-label" x="738" y="220" class="label" text-anchor="middle" font-size="12">AUG</text>
</g>
<g id="month-sep" data-state="default">

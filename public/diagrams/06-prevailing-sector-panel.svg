<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Prevailing Sector Panel</title>
<desc id="desc">Independently bindable direction, season, frequency, wind-speed and compass-sector elements with an honest not-established frequency state.</desc>

<style>
  .heading { font-family:Fraunces, Georgia, serif; fill:#24344a; }
  .body { font-family:Inter, Arial, sans-serif; fill:#334155; }
  .label { font-family:Inter, Arial, sans-serif; fill:#566274; letter-spacing:1.4px; }
  .data { font-family:Inter, Arial, sans-serif; fill:#24344a; }
  .solar { stroke:#e58b1a; fill:none; }
  .solar-fill { fill:#e58b1a; }
  .wind { stroke:#4f9fd9; fill:none; }
  .wind-secondary { stroke:#62b8ae; fill:none; }
  .ref { stroke:#9ba4ad; fill:none; stroke-dasharray:6 6; }
  .fine { stroke:#c5c9ce; fill:none; }
  .mass-front { fill:#f5f3ee; stroke:#8d9399; }
  .mass-side { fill:#dddcd7; stroke:#8d9399; }
  .mass-top { fill:#fbfaf7; stroke:#8d9399; }
  .shadow { fill:#aeb2b4; opacity:.28; }
  .north { stroke:#28343f; fill:none; }
</style>


<g id="component-prevailing-sector">
  <rect x="30" y="30" width="1140" height="560" rx="22" fill="#fff" stroke="#d8dce0"/>
  <text x="75" y="88" class="heading" font-size="26">PREVAILING SECTOR</text>
  <text x="75" y="125" class="label" font-size="12">PRIMARY → SECONDARY</text>
  <line x1="75" y1="160" x2="520" y2="160" stroke="#d8dce0"/>
  <g id="primary-direction-slot"><text class="label" x="75" y="205" font-size="11">PRIMARY DIRECTION</text><text id="primary-direction-value" class="data" x="75" y="240" font-size="28">—</text></g>
  <g id="secondary-direction-slot"><text class="label" x="280" y="205" font-size="11">SECONDARY DIRECTION</text><text id="secondary-direction-value" class="data" x="280" y="240" font-size="28">—</text></g>
  <g id="season-state-slot"><text class="label" x="75" y="300" font-size="11">SEASON / STATE</text><text id="season-state-value" class="data" x="75" y="335" font-size="22">—</text></g>
  <g id="frequency-status-slot"><rect x="75" y="380" width="445" height="90" fill="#f6f7f8" stroke="#dfe2e5"/><text class="label" x="95" y="410" font-size="10">FREQUENCY STATUS</text><text id="frequency-status-value" class="data" x="95" y="445" font-size="20">NOT ESTABLISHED</text></g>
  <g id="wind-speed-slot"><text class="label" x="650" y="425" font-size="11">WIND SPEED</text><text id="wind-speed-value" class="data" x="650" y="465" font-size="34">—</text><text id="wind-speed-qualifier" class="label" x="650" y="490" font-size="11">OPTIONAL QUALIFIER</text></g>
  <g id="compass-sector-graphic" transform="translate(900 300)">
    <circle r="155" fill="none" stroke="#c8cdd1"/><circle r="115" fill="none" stroke="#dfe2e5"/>
    <path id="primary-sector" d="M0 0 L60 -145 A155 155 0 0 1 130 -85 Z" fill="#4f89c7" opacity=".95"/>
    <path id="secondary-sector" d="M0 0 L145 -20 A150 150 0 0 1 150 25 Z" fill="#62b8ae" opacity=".95"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#9ba4ad"/><line x1="-155" y1="0" x2="155" y2="0" stroke="#9ba4ad"/>
    <text class="heading" x="0" y="-170" text-anchor="middle" font-size="16">N</text><text class="heading" x="170" y="5" text-anchor="middle" font-size="16">E</text><text class="heading" x="0" y="182" text-anchor="middle" font-size="16">S</text><text class="heading" x="-170" y="5" text-anchor="middle" font-size="16">W</text>
  </g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Solar Path Diagram — single</title>
<desc id="desc">Solar path reference arcs, selected monthly path placeholder, noon marker, north reference, building mass and independent shadow layer.</desc>

<style>
  .heading { font-family:Fraunces, Georgia, serif; fill:#24344a; }
  .body { font-family:Inter, Arial, sans-serif; fill:#334155; }
  .label { font-family:Inter, Arial, sans-serif; fill:#566274; letter-spacing:1.4px; }
  .data { font-family:Inter, Arial, sans-serif; fill:#24344a; }
  .solar { stroke:#e58b1a; fill:none; }
  .solar-fill { fill:#e58b1a; }
  .wind { stroke:#4f9fd9; fill:none; }
  .wind-secondary { stroke:#62b8ae; fill:none; }
  .ref { stroke:#9ba4ad; fill:none; stroke-dasharray:6 6; }
  .fine { stroke:#c5c9ce; fill:none; }
  .mass-front { fill:#f5f3ee; stroke:#8d9399; }
  .mass-side { fill:#dddcd7; stroke:#8d9399; }
  .mass-top { fill:#fbfaf7; stroke:#8d9399; }
  .shadow { fill:#aeb2b4; opacity:.28; }
  .north { stroke:#28343f; fill:none; }
</style>


<g id="component-solar-path">
  <text x="42" y="56" class="heading" font-size="30">Solar Path Diagram</text>
  <text x="42" y="84" class="label" font-size="12">DATA-DRIVEN ARTWORK · SINGLE MASSING</text>
  <g id="solar-reference-dome">
    <path id="path-summer-solstice" class="ref" stroke-width="1.5" d="M120 515 C210 125 870 90 1080 515"/>
    <path id="path-equinox" class="ref" stroke-width="1.5" d="M170 515 C310 225 820 225 1030 515"/>
    <path id="path-winter-solstice" class="ref" stroke-width="1.5" d="M230 515 C390 345 730 345 970 515"/>
  </g>
  <path id="path-selected" class="solar" stroke-width="3" d="M150 515 C300 155 790 120 1050 515"/>
  <g id="noon-marker"><circle cx="705" cy="155" r="8" fill="#e58b1a"/><circle cx="705" cy="155" r="16" fill="none" stroke="#e58b1a" opacity=".35"/></g>
  <g id="azimuth-reference-ticks" class="fine" stroke-width="1">
    <line x1="980.0" y1="515.0" x2="950.0" y2="515.0"/><line x1="974.2" y1="581.0" x2="944.7" y2="575.8"/><line x1="957.1" y1="645.0" x2="928.9" y2="634.7"/><line x1="929.1" y1="705.0" x2="903.1" y2="690.0"/><line x1="891.1" y1="759.3" x2="868.1" y2="740.0"/><line x1="844.3" y1="806.1" x2="825.0" y2="783.1"/><line x1="790.0" y1="844.1" x2="775.0" y2="818.1"/><line x1="730.0" y1="872.1" x2="719.7" y2="843.9"/><line x1="666.0" y1="889.2" x2="660.8" y2="859.7"/><line x1="600.0" y1="895.0" x2="600.0" y2="865.0"/><line x1="534.0" y1="889.2" x2="539.2" y2="859.7"/><line x1="470.0" y1="872.1" x2="480.3" y2="843.9"/><line x1="410.0" y1="844.1" x2="425.0" y2="818.1"/><line x1="355.7" y1="806.1" x2="375.0" y2="783.1"/><line x1="308.9" y1="759.3" x2="331.9" y2="740.0"/><line x1="270.9" y1="705.0" x2="296.9" y2="690.0"/><line x1="242.9" y1="645.0" x2="271.1" y2="634.7"/><line x1="225.8" y1="581.0" x2="255.3" y2="575.8"/><line x1="220.0" y1="515.0" x2="250.0" y2="515.0"/><line x1="225.8" y1="449.0" x2="255.3" y2="454.2"/><line x1="242.9" y1="385.0" x2="271.1" y2="395.3"/><line x1="270.9" y1="325.0" x2="296.9" y2="340.0"/><line x1="308.9" y1="270.7" x2="331.9" y2="290.0"/><line x1="355.7" y1="223.9" x2="375.0" y2="246.9"/><line x1="410.0" y1="185.9" x2="425.0" y2="211.9"/><line x1="470.0" y1="157.9" x2="480.3" y2="186.1"/><line x1="534.0" y1="140.8" x2="539.2" y2="170.3"/><line x1="600.0" y1="135.0" x2="600.0" y2="165.0"/><line x1="666.0" y1="140.8" x2="660.8" y2="170.3"/><line x1="730.0" y1="157.9" x2="719.7" y2="186.1"/><line x1="790.0" y1="185.9" x2="775.0" y2="211.9"/><line x1="844.3" y1="223.9" x2="825.0" y2="246.9"/><line x1="891.1" y1="270.7" x2="868.1" y2="290.0"/><line x1="929.1" y1="325.0" x2="903.1" y2="340.0"/><line x1="957.1" y1="385.0" x2="928.9" y2="395.3"/><line x1="974.2" y1="449.0" x2="944.7" y2="454.2"/>
  </g>
  <g id="cardinal-labels" class="heading" font-size="18" text-anchor="middle">
    <text x="600" y="102">N</text><text x="1088" y="522">E</text><text x="600" y="715">S</text><text x="112" y="522">W</text>
  </g>
  <g id="north-indicator"><line class="north" x1="600" y1="515" x2="600" y2="110" stroke-width="1.5"/><path d="M600 110 l-7 16 h14 z" fill="#28343f"/></g>
  <g id="building-mass" transform="scale(1.0) translate(0.0 0.0)">
<g id="building-mass-volume-1">
<path id="building-mass-volume-1-front" class="mass-front" d="M 440,555 L 670,555 L 670,700 L 440,700 Z"/>
<path id="building-mass-volume-1-side" class="mass-side" d="M 670,555 L 722.5,502.5 L 722.5,647.5 L 670,700 Z"/>
<path id="building-mass-volume-1-top" class="mass-top" d="M 440,555 L 492.5,502.5 L 722.5,502.5 L 670,555 Z"/>
<path id="building-mass-volume-1-opening" d="M 464,583 L 488,571 L 488,682 L 464,694 Z" fill="#e9e7e1" stroke="#a1a4a6"/>
</g>
</g>
  <path id="building-shadow" class="shadow" d="M470 555 L760 590 L890 650 L610 615 Z"/>
  <g id="legend" transform="translate(840 90)">
    <text class="heading" font-size="17" x="0" y="0">LEGEND</text>
    <line class="ref" x1="0" y1="30" x2="42" y2="30"/><text class="label" x="56" y="34" font-size="11">REFERENCE PATH</text>
    <line class="solar" x1="0" y1="58" x2="42" y2="58" stroke-width="3"/><text class="label" x="56" y="62" font-size="11">SELECTED PATH</text>
    <circle cx="21" cy="86" r="6" class="solar-fill"/><text class="label" x="56" y="90" font-size="11">NOON MARKER</text>
    <rect x="0" y="110" width="42" height="22" class="mass-front"/><text class="label" x="56" y="126" font-size="11">BUILDING</text>
    <rect x="0" y="145" width="42" height="22" class="shadow"/><text class="label" x="56" y="161" font-size="11">SHADOW (INDICATIVE)</text>
  </g>
</g>
</svg>
